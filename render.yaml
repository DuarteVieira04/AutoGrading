# Blueprint Render — repo AutoGrading (web + worker + Postgres + disco)
# Deploy: Dashboard Render → New → Blueprint → liga este repositório Git.
#
# Plano gratuito: só o serviço "autograding-web" (inclui fila no mesmo contentor).
# Worker separado e disco persistente exigem plano Starter (~7 USD/mês por serviço).

services:
  - type: web
    name: autograding-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/docker/entrypoint-web.sh
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      # Driver Laravel: pgsql (NÃO uses o nome do serviço "autograding-db" aqui)
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: autograding-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: AUTOGRADING_PROJECT_ROOT
        value: /app
      - key: AUTOGRADING_PYTHON
        value: python3
      - key: AUTOGRADING_NODE_BINARY
        value: /usr/bin/node
      - key: AUTOGRADING_NPM_BINARY
        value: /usr/bin/npm
      - key: AUTOGRADING_ENABLED
        value: "true"
      - key: AUTOGRADING_RUN_SYNC
        value: "false"
      - key: AUTOGRADING_TIMEOUT
        value: "1900"
      - key: RUN_QUEUE_WORKER
        value: "true"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: AutoGrading
    # Disco persistente (ZIPs, relatórios): requer plano Starter no serviço web.
    # Sem disco, ficheiros em storage/ perdem-se ao redeploy.
    # disk:
    #   name: autograding-storage
    #   mountPath: /app/submission-platform/storage
    #   sizeGB: 10

