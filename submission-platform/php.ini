; Limites para upload do projeto base do docente (ZIP ~100 MB).
; CLI: ./serve, ./queue ou composer run serve (php -c php.ini).
; PHP-FPM/Apache: public/.user.ini (reiniciar o serviço após alterar).
; Sistema: copiar estas directivas para o php.ini do PHP (ex. /etc/php/8.x/cli/php.ini).

upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 1900
memory_limit = 512M
